name: build

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Caddy ref to build (tag, branch or commit). Empty = newest vX.Y.Z tag.
        required: false
        default: ''

permissions: {}

concurrency:
  group: build-${{ inputs.ref || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Caddy ref and image tags
        id: meta
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF}"
          if [ -z "$ref" ]; then
            # Newest stable tag. Uses git tags rather than GitHub releases, so a
            # version is picked up even if upstream's release publishing lags.
            ref=$(git ls-remote --tags --refs https://github.com/caddyserver/caddy.git 'v2.*' \
              | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "invalid ref: $ref" >&2; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          date=$(date -u +%Y%m%d)
          if [[ "$ref" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            tags="$image:latest,$image:$version,$image:$version-$date"
          else
            slug=$(tr -c 'a-zA-Z0-9._-' '-' <<<"$ref" | sed 's/-*$//')
            tags="$image:$slug,$image:$slug-$date"
          fi
          {
            echo "ref=$ref"
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "Building Caddy $ref -> $tags" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (amd64, for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          build-args: CADDY_REF=${{ steps.meta.outputs.ref }}
          tags: ${{ steps.meta.outputs.image }}:test
          cache-to: type=gha,mode=max

      - name: Test
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:test
        run: test/smoke.sh "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Vulnerability report (informational)
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:test
        run: |
          set -euo pipefail
          id=$(docker create "$IMAGE")
          docker cp "$id:/app/caddy" caddy-bin
          docker rm "$id" >/dev/null
          go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary caddy-bin > govulncheck.txt || true
          { echo '<details><summary>govulncheck</summary>'; echo; echo '```'; cat govulncheck.txt; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: CADDY_REF=${{ steps.meta.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.title=caddy
            org.opencontainers.image.description=Hardened drop-in replacement for ghcr.io/hotio/caddy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ref }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
