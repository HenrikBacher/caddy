name: build

on:
  schedule:
    # Hourly, but only builds when an input changed (see the check job).
    - cron: '7 * * * *' # :07 past every hour, UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Caddy ref to build (tag, branch or commit). Empty = newest vX.Y.Z tag.
        required: false
        default: ''

permissions: {}

concurrency:
  group: build-${{ inputs.ref || 'default' }}
  cancel-in-progress: false

jobs:
  # Resolves the Caddy tag, Go version, distroless digest and plugin versions.
  # Scheduled runs skip the build when they match the inputs label on the
  # published :latest image; pushes and manual runs always build.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      ref: ${{ steps.inputs.outputs.ref }}
      go_image: ${{ steps.inputs.outputs.go_image }}
      base_image: ${{ steps.inputs.outputs.base_image }}
      base_digest: ${{ steps.inputs.outputs.base_digest }}
      desec_version: ${{ steps.inputs.outputs.desec_version }}
      ratelimit_version: ${{ steps.inputs.outputs.ratelimit_version }}
      inputs: ${{ steps.inputs.outputs.inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: inputs
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}" scripts/resolve-inputs.sh "$INPUT_REF" | tee -a "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          INPUTS: ${{ steps.inputs.outputs.inputs }}
          PUBLISHED: ${{ steps.inputs.outputs.published_inputs }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$INPUTS" = "$PUBLISHED" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Up to date, skipping build: \`$INPUTS\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            {
              echo "Building ($GITHUB_EVENT_NAME)"
              echo
              echo "| | inputs |"
              echo "|---|---|"
              echo "| published | \`${PUBLISHED:-none}\` |"
              echo "| new | \`$INPUTS\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Builds the image once, as an OCI archive with SBOM and provenance, and
  # tests that exact archive. No write permissions and no registry login, so
  # nothing that runs here (test images, govulncheck) can push or sign.
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=max
          sbom: true
          build-args: |
            CADDY_REF=${{ needs.check.outputs.ref }}
            GO_IMAGE=${{ needs.check.outputs.go_image }}
            BASE_IMAGE=${{ needs.check.outputs.base_image }}
            DESEC_VERSION=${{ needs.check.outputs.desec_version }}
            RATELIMIT_VERSION=${{ needs.check.outputs.ratelimit_version }}
          labels: |
            org.opencontainers.image.title=caddy
            org.opencontainers.image.description=Hardened drop-in replacement for ghcr.io/hotio/caddy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.ref }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=gcr.io/distroless/static-debian13
            org.opencontainers.image.base.digest=${{ needs.check.outputs.base_digest }}
            io.github.henrikbacher.caddy.inputs=${{ needs.check.outputs.inputs }}

      - name: Load the archive into Docker
        run: skopeo copy "oci-archive:$RUNNER_TEMP/image.tar" docker-daemon:caddy:test

      - name: Test
        run: test/smoke.sh caddy:test | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Vulnerability report (informational)
        continue-on-error: true
        env:
          GO_IMAGE: ${{ needs.check.outputs.go_image }}
        run: |
          set -euo pipefail
          id=$(docker create caddy:test)
          docker cp "$id:/app/caddy" caddy-bin
          docker rm "$id" >/dev/null
          # Pinned govulncheck in the pinned Go image, seeing only the binary.
          docker run --rm -v "$PWD/caddy-bin:/caddy-bin:ro" "$GO_IMAGE" \
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /caddy-bin > govulncheck.txt || true
          { echo '<details><summary>govulncheck</summary>'; echo; echo '```'; cat govulncheck.txt; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  # Pushes the tested archive byte for byte (same digests) and signs it. Runs
  # only first-party steps: no build, no tests, no third-party images.
  publish:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - name: Image tags
        id: meta
        env:
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          date=$(date -u +%Y%m%d)
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            tags="latest $version $version-$date"
          else
            slug=$(tr -c 'a-zA-Z0-9._-' '-' <<<"$REF" | sed 's/-*$//')
            tags="$slug $slug-$date"
          fi
          {
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing Caddy $REF -> $image: $tags" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/digest" \
              "oci-archive:$RUNNER_TEMP/image.tar" "docker://$IMAGE:$tag"
            digest=$(cat "$RUNNER_TEMP/digest")
            [ -z "${first:-}" ] || [ "$digest" = "$first" ] || { echo "digest changed between tags" >&2; exit 1; }
            first=$digest
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
