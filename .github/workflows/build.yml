name: build

on:
  schedule:
    # Daily, but only builds when an input changed (see the check job).
    - cron: '7 0 * * *' # 00:07 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Caddy ref to build (tag, branch or commit). Empty = newest vX.Y.Z tag.
        required: false
        default: ''

permissions: {}

concurrency:
  group: build-${{ inputs.ref || 'default' }}
  cancel-in-progress: false

jobs:
  # Resolves the Caddy tag, Go version, distroless digest and plugin versions.
  # Scheduled runs skip the build when they match the inputs label on the
  # published :latest image; pushes and manual runs always build.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      ref: ${{ steps.inputs.outputs.ref }}
      go_image: ${{ steps.inputs.outputs.go_image }}
      base_image: ${{ steps.inputs.outputs.base_image }}
      base_digest: ${{ steps.inputs.outputs.base_digest }}
      cloudflare_version: ${{ steps.inputs.outputs.cloudflare_version }}
      ratelimit_version: ${{ steps.inputs.outputs.ratelimit_version }}
      inputs: ${{ steps.inputs.outputs.inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: inputs
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}" scripts/resolve-inputs.sh "$INPUT_REF" | tee -a "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          INPUTS: ${{ steps.inputs.outputs.inputs }}
          PUBLISHED: ${{ steps.inputs.outputs.published_inputs }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$INPUTS" = "$PUBLISHED" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Up to date, skipping build: \`$INPUTS\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            {
              echo "Building ($GITHUB_EVENT_NAME)"
              echo
              echo "| | inputs |"
              echo "|---|---|"
              echo "| published | \`${PUBLISHED:-none}\` |"
              echo "| new | \`$INPUTS\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image tags
        id: meta
        env:
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          date=$(date -u +%Y%m%d)
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            tags="$image:latest,$image:$version,$image:$version-$date"
          else
            slug=$(tr -c 'a-zA-Z0-9._-' '-' <<<"$REF" | sed 's/-*$//')
            tags="$image:$slug,$image:$slug-$date"
          fi
          {
            echo "ref=$REF"
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "Building Caddy $REF -> $tags" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            CADDY_REF=${{ needs.check.outputs.ref }}
            GO_IMAGE=${{ needs.check.outputs.go_image }}
            BASE_IMAGE=${{ needs.check.outputs.base_image }}
            CLOUDFLARE_VERSION=${{ needs.check.outputs.cloudflare_version }}
            RATELIMIT_VERSION=${{ needs.check.outputs.ratelimit_version }}
          tags: ${{ steps.meta.outputs.image }}:test

      - name: Test
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:test
        run: test/smoke.sh "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Vulnerability report (informational)
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:test
        run: |
          set -euo pipefail
          id=$(docker create "$IMAGE")
          docker cp "$id:/app/caddy" caddy-bin
          docker rm "$id" >/dev/null
          go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary caddy-bin > govulncheck.txt || true
          { echo '<details><summary>govulncheck</summary>'; echo; echo '```'; cat govulncheck.txt; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Push (reuses the tested build from the local cache)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            CADDY_REF=${{ needs.check.outputs.ref }}
            GO_IMAGE=${{ needs.check.outputs.go_image }}
            BASE_IMAGE=${{ needs.check.outputs.base_image }}
            CLOUDFLARE_VERSION=${{ needs.check.outputs.cloudflare_version }}
            RATELIMIT_VERSION=${{ needs.check.outputs.ratelimit_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=caddy
            org.opencontainers.image.description=Hardened drop-in replacement for ghcr.io/hotio/caddy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ref }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=gcr.io/distroless/static-debian13
            org.opencontainers.image.base.digest=${{ needs.check.outputs.base_digest }}
            io.github.henrikbacher.caddy.inputs=${{ needs.check.outputs.inputs }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
